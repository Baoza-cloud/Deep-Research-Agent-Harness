name: agent-harness-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12.7 offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Verify module entry point
        run: python -m research_engine --help

      - name: Run 112 offline tests
        run: python -m pytest -q tests/test_research_engine.py

      - name: Run zero-key offline smoke test
        env:
          DEEPSEEK_API_KEY: ""
          MIMO_API_KEY: ""
          OPENAI_API_KEY: ""
          TAVILY_API_KEY: ""
          VLLM_API_KEY: ""
        run: python scripts/offline_smoke.py
