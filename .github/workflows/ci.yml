name: agent-harness-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Locked tests, lint, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Verify formatting and lint
        run: |
          ruff format --check src/research_engine evaluation scripts tests
          ruff check src/research_engine evaluation scripts tests

      - name: Run offline tests with coverage
        run: |
          coverage run -m pytest -q tests
          coverage report
          coverage xml

      - name: Verify module and console entry points
        run: |
          python -m research_engine --help
          deep-research --help

      - name: Run zero-key offline smoke test
        env:
          DEEPSEEK_API_KEY: ""
          MIMO_API_KEY: ""
          OPENAI_API_KEY: ""
          TAVILY_API_KEY: ""
          VLLM_API_KEY: ""
        run: python scripts/offline_smoke.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test runner
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest==7.4.4

      - name: Run offline compatibility suite
        run: python -m pytest -q tests

  package:
    name: Build and install distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build

      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/deep-research" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" scripts/offline_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: deep-research-agent-harness-v1.1.0
          path: dist/*
          if-no-files-found: error
