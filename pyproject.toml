[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent-harness"
version = "1.1.0"
description = "Agent harness for reproducible multi-role deep research with retrieval, verification, adversarial repair, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Baoza-cloud"},
]
keywords = [
    "agent-harness",
    "deep-research",
    "multi-agent",
    "retrieval",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40,<2",
    "tavily-python",
]

[project.optional-dependencies]
local-rag = [
    "faiss-cpu",
    "jieba",
    "numpy",
    "rank-bm25",
    "sentence-transformers",
]
dev = [
    "build==1.6.1",
    "coverage==7.16.1",
    "pytest==9.1.1",
    "ruff==0.15.17",
]

[project.urls]
Homepage = "https://github.com/Baoza-cloud/Deep-Research-Agent-Harness"
Documentation = "https://github.com/Baoza-cloud/Deep-Research-Agent-Harness/blob/main/docs/DEEP_RESEARCH_AGENT.md"
Issues = "https://github.com/Baoza-cloud/Deep-Research-Agent-Harness/issues"
Changelog = "https://github.com/Baoza-cloud/Deep-Research-Agent-Harness/blob/main/CHANGELOG.md"

[project.scripts]
deep-research = "research_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "bm25_retrieval",
    "context_builder",
    "document_loader",
    "embedding_model",
    "hybrid_retrieval",
    "llm_client",
    "prompt_builder",
    "rag_pipeline",
    "relevance_filter",
    "retrieval",
    "retrieval_worker",
    "source_builder",
    "text_splitter",
    "vector_store",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_engine*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "evaluation/results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.coverage.run]
branch = true
source = ["research_engine"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
